version: '3.5'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-22.9}
    ports:
      - "${CLICKHOUSE_PORT:-8123}:8123"
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./tmp/clickhouse-data:/opt/clickhouse/data
    networks:
      - default

networks:
  default:
